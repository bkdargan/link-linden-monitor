name: Link Linden Apartment Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests
          pip install beautifulsoup4

      - name: Run Apartment Monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python scripts/check_apartments.py

      - name: Commit Updated Reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add availability_report.json
          git add previous_count.json

          git diff --staged --quiet || git commit -m "Apartment availability update"

          git push
