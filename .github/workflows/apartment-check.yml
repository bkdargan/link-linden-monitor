name: Apartment Monitor

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: |
          pip install requests
          pip install beautifulsoup4

      - name: Run Monitor
        run: |
          python scripts/check_apartments.py

      - name: Commit Report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add availability_report.json

          git diff --staged --quiet || git commit -m "Apartment availability update"

          git push
